<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-manpower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="spot-manpower" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#18181b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="iso-grid-manpower" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 30 17.32 L 60 0 M 0 34.64 L 30 17.32 L 60 34.64 M 30 0 L 30 34.64" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Deep Industrial Canvas -->
  <rect width="800" height="600" fill="url(#bg-grad-manpower)" />
  <rect width="800" height="600" fill="url(#spot-manpower)" />
  <rect width="800" height="600" fill="url(#iso-grid-manpower)" />

  <!-- Construction Cranes & Structural Steel Trusses -->
  <g transform="translate(100, 30)" opacity="0.35">
    <!-- Heavy Tower Crane 1 -->
    <path d="M 450 480 L 450 120 L 465 120 L 465 480 Z" fill="#27272a" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Crane Truss cross bracing -->
    <line x1="450" y1="140" x2="465" y2="170" stroke="#f59e0b" stroke-width="1" />
    <line x1="465" y1="140" x2="450" y2="170" stroke="#f59e0b" stroke-width="1" />
    <line x1="450" y1="170" x2="465" y2="200" stroke="#f59e0b" stroke-width="1" />
    <line x1="465" y1="170" x2="450" y2="200" stroke="#f59e0b" stroke-width="1" />
    <line x1="450" y1="200" x2="465" y2="230" stroke="#f59e0b" stroke-width="1" />
    <line x1="465" y1="200" x2="450" y2="230" stroke="#f59e0b" stroke-width="1" />
    <!-- Horizontal Jib Boom -->
    <line x1="260" y1="120" x2="560" y2="120" stroke="#f59e0b" stroke-width="3" />
    <line x1="260" y1="120" x2="457" y2="70" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="457" y1="70" x2="560" y2="120" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="457" y1="70" x2="457" y2="120" stroke="#f59e0b" stroke-width="2" />
    <!-- Hoist Cable and Hook -->
    <line x1="330" y1="120" x2="330" y2="240" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 2" />
    <polygon points="325,240 335,240 330,250" fill="#fbbf24" />
    <!-- Crane Beacon Light -->
    <circle cx="457" cy="65" r="4" fill="#ef4444" />
    <circle cx="457" cy="65" r="10" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Structural Geometric Framework & Beams -->
  <g transform="translate(0, 160)" opacity="0.4">
    <path d="M 0 350 L 220 220 L 420 220 L 620 350" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />
    <line x1="220" y1="220" x2="220" y2="400" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="420" y1="220" x2="420" y2="400" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="220" y1="260" x2="420" y2="360" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.2" />
    <line x1="220" y1="360" x2="420" y2="260" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- Mobilization Wave & Safety Hardhat / Team Presence Glyph -->
  <g transform="translate(180, 240)">
    <!-- Safety Hardhat Geometric Symbol in Center Left -->
    <path d="M 30 140 C 30 90, 110 90, 110 140 Z" fill="#27272a" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M 15 140 L 125 140" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <line x1="70" y1="95" x2="70" y2="140" stroke="#fbbf24" stroke-width="2" />
    <!-- Glow around Hardhat -->
    <ellipse cx="70" cy="120" rx="60" ry="40" fill="#f59e0b" fill-opacity="0.12" />

    <!-- Secondary Team Members in Formation -->
    <path d="M 140 150 C 140 115, 200 115, 200 150 Z" fill="#18181b" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6" />
    <path d="M 130 150 L 210 150" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round" />

    <path d="M 220 155 C 220 125, 275 125, 275 155 Z" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 212 155 L 282 155" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />
  </g>

  <!-- Metric Badges: Compliant & Rapid Mobilization -->
  <g transform="translate(520, 280)">
    <!-- Hexagonal MOHRE Compliance Badge -->
    <polygon points="120,40 160,65 160,110 120,135 80,110 80,65" fill="#18181b" stroke="#84cc16" stroke-width="2" stroke-opacity="0.7" />
    <polyline points="105,88 116,98 135,78" fill="none" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Radar Ring Around Compliance -->
    <circle cx="120" cy="88" r="55" fill="none" stroke="#84cc16" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4" />
  </g>

  <!-- Bottom Fog Scrim -->
  <rect y="420" width="800" height="180" fill="url(#bg-grad-manpower)" opacity="0.85" />
</svg>
