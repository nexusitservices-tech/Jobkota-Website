<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-pay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a16" />
      <stop offset="50%" stop-color="#062922" />
      <stop offset="100%" stop-color="#020e0c" />
    </linearGradient>
    <linearGradient id="mint-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="spot-pay" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#041a16" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="fin-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Deep Fintech Ledger Canvas -->
  <rect width="800" height="600" fill="url(#bg-grad-pay)" />
  <rect width="800" height="600" fill="url(#spot-pay)" />
  <rect width="800" height="600" fill="url(#fin-grid)" />

  <!-- Ascending Growth Chart & Currency Flow Curves -->
  <g transform="translate(60, 100)" opacity="0.85">
    <!-- Chart Axis Gridlines -->
    <line x1="80" y1="280" x2="680" y2="280" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="80" y1="210" x2="680" y2="210" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="4 4" />
    <line x1="80" y1="140" x2="680" y2="140" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="4 4" />
    <line x1="80" y1="70" x2="680" y2="70" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="4 4" />

    <!-- Histogram Bar Pillars with Glowing Tops -->
    <rect x="120" y="220" width="28" height="60" rx="4" fill="#06352b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="190" y="190" width="28" height="90" rx="4" fill="#06352b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" />
    <rect x="260" y="160" width="28" height="120" rx="4" fill="#06352b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
    <rect x="330" y="125" width="28" height="155" rx="4" fill="#074437" stroke="#34d399" stroke-width="1.4" />
    <rect x="400" y="90" width="28" height="190" rx="4" fill="#095545" stroke="#34d399" stroke-width="1.6" />
    <rect x="470" y="60" width="28" height="220" rx="4" fill="#0b6653" stroke="#fbbf24" stroke-width="1.8" />

    <!-- Upward Trendline & Glowing Nodes -->
    <path d="M 134 220 Q 230 180, 274 160 T 414 90 T 484 60 T 600 35" fill="none" stroke="url(#mint-gold)" stroke-width="3" />
    
    <!-- Pulse nodes on trendline -->
    <circle cx="134" cy="220" r="4.5" fill="#10b981" />
    <circle cx="274" cy="160" r="5" fill="#34d399" />
    <circle cx="414" cy="90" r="5.5" fill="#34d399" />
    <circle cx="484" cy="60" r="6" fill="#fbbf24" />
    <circle cx="484" cy="60" r="14" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- WPS (Wages Protection System) Digital Vault / Card Motif -->
  <g transform="translate(100, 280)">
    <!-- Sleek Corporate Payroll Card -->
    <rect x="0" y="0" width="220" height="135" rx="16" fill="#052c24" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.7" transform="rotate(-4)" />
    <!-- Chip and Brand Marks -->
    <rect x="25" y="30" width="34" height="26" rx="5" fill="#fbbf24" stroke="#d97706" stroke-width="1" transform="rotate(-4)" />
    <circle cx="160" cy="42" r="16" fill="#10b981" fill-opacity="0.4" transform="rotate(-4)" />
    <circle cx="180" cy="42" r="16" fill="#fbbf24" fill-opacity="0.4" transform="rotate(-4)" />
    <!-- Embossed Salary Stream Lines -->
    <line x1="25" y1="80" x2="140" y2="80" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" transform="rotate(-4)" />
    <line x1="25" y1="95" x2="90" y2="95" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" transform="rotate(-4)" />
    
    <!-- Currency Symbols Floating -->
    <text x="140" y="112" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#a7f3d0" transform="rotate(-4)">AED • WPS</text>
  </g>

  <!-- Biometric Lock & SIF Bank Clearing Indicator -->
  <g transform="translate(560, 260)">
    <circle cx="50" cy="50" r="48" fill="#052922" stroke="#10b981" stroke-width="2" />
    <circle cx="50" cy="50" r="62" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 5" />
    <!-- Lock Shackle and Body -->
    <rect x="36" y="44" width="28" height="22" rx="4" fill="#10b981" />
    <path d="M 42 44 L 42 34 C 42 28, 58 28, 58 34 L 58 44" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" />
    <circle cx="50" cy="54" r="2.5" fill="#041a16" />
    <!-- Shield Check Mark -->
    <text x="24" y="88" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#34d399" letter-spacing="1.5">100% WPS</text>
  </g>

  <!-- Bottom Fog Scrim -->
  <rect y="440" width="800" height="160" fill="url(#bg-grad-pay)" opacity="0.85" />
</svg>
