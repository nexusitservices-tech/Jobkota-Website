<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-hr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051b24" />
      <stop offset="50%" stop-color="#0a2a35" />
      <stop offset="100%" stop-color="#020d13" />
    </linearGradient>
    <linearGradient id="cyan-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="spot-hr" cx="30%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#041b24" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="dot-grid-hr" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="#06b6d4" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Deep Corporate People Ops Canvas -->
  <rect width="800" height="600" fill="url(#bg-grad-hr)" />
  <rect width="800" height="600" fill="url(#spot-hr)" />
  <rect width="800" height="600" fill="url(#dot-grid-hr)" />

  <!-- Organizational Structure Tree & Collaborative Flow Vectors -->
  <g transform="translate(180, 100)" opacity="0.85">
    <!-- Top Organization Leader / People Ops Head Node -->
    <rect x="180" y="40" width="100" height="38" rx="10" fill="#092f3b" stroke="#06b6d4" stroke-width="1.8" />
    <circle cx="205" cy="59" r="8" fill="#06b6d4" fill-opacity="0.4" />
    <line x1="222" y1="55" x2="265" y2="55" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    <line x1="222" y1="63" x2="250" y2="63" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" />

    <!-- Branch lines to Sub-Departments -->
    <path d="M 230 78 L 230 130" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    <path d="M 90 130 L 370 130" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="90" y1="130" x2="90" y2="160" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="230" y1="130" x2="230" y2="160" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="370" y1="130" x2="370" y2="160" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Node 1: Talent Acquisition & Onboarding -->
    <rect x="45" y="160" width="90" height="34" rx="8" fill="#08232c" stroke="#10b981" stroke-width="1.4" />
    <circle cx="65" cy="177" r="6" fill="#10b981" />
    <line x1="78" y1="174" x2="120" y2="174" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" />
    <line x1="78" y1="180" x2="105" y2="180" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- Node 2: Visa & Labor Card Operations -->
    <rect x="185" y="160" width="90" height="34" rx="8" fill="#08232c" stroke="#06b6d4" stroke-width="1.4" />
    <circle cx="205" cy="177" r="6" fill="#06b6d4" />
    <line x1="218" y1="174" x2="260" y2="174" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" />
    <line x1="218" y1="180" x2="245" y2="180" stroke="#bae6fd" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- Node 3: Policy, Welfare & Performance -->
    <rect x="325" y="160" width="90" height="34" rx="8" fill="#08232c" stroke="#38bdf8" stroke-width="1.4" />
    <circle cx="345" cy="177" r="6" fill="#38bdf8" />
    <line x1="358" y1="174" x2="400" y2="174" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" />
    <line x1="358" y1="180" x2="385" y2="180" stroke="#e0f2fe" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" />
  </g>

  <!-- Modern Clipboard & HR Policy Document Motif -->
  <g transform="translate(100, 260)">
    <!-- Slanted Clipboard Base -->
    <rect x="0" y="0" width="130" height="170" rx="14" fill="#07222c" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.7" transform="rotate(-6)" />
    <!-- Clip on Top -->
    <rect x="38" y="-12" width="46" height="20" rx="5" fill="#0e3846" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-6)" />
    <circle cx="61" cy="-2" r="3" fill="#38bdf8" transform="rotate(-6)" />
    
    <!-- Checklist items inside document -->
    <g transform="rotate(-6) translate(20, 35)">
      <circle cx="8" cy="12" r="4" fill="#10b981" />
      <line x1="22" y1="12" x2="85" y2="12" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />
      
      <circle cx="8" cy="36" r="4" fill="#10b981" />
      <line x1="22" y1="36" x2="75" y2="36" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />

      <circle cx="8" cy="60" r="4" fill="#10b981" />
      <line x1="22" y1="60" x2="80" y2="60" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" />

      <circle cx="8" cy="84" r="4" fill="#38bdf8" />
      <line x1="22" y1="84" x2="65" y2="84" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
    </g>
  </g>

  <!-- Labor Law Shield & Security Guarantee -->
  <g transform="translate(560, 240)">
    <!-- Security Shield -->
    <path d="M 50 20 L 110 40 L 110 100 C 110 150, 50 180, 50 180 C 50 180, -10 150, -10 100 L -10 40 Z" fill="#092833" stroke="#10b981" stroke-width="2" stroke-opacity="0.8" />
    <path d="M 50 35 L 95 50 L 95 98 C 95 138, 50 162, 50 162 C 50 162, 5 138, 5 98 L 5 50 Z" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
    <!-- Checkmark inside Shield -->
    <polyline points="28,95 44,110 74,80" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Radiant Glow Ring -->
    <circle cx="50" cy="95" r="75" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="5 5" />
  </g>

  <!-- Bottom Fog Scrim -->
  <rect y="440" width="800" height="160" fill="url(#bg-grad-hr)" opacity="0.85" />
</svg>
